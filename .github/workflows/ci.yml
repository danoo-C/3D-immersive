name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Qt must never try to open a display on a CI runner.
  QT_QPA_PLATFORM: offscreen
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # PySide6 needs these to load libQt6Gui even under the offscreen
      # platform plugin. Without them every Qt import fails on the runner.
      # libportaudio2 is sounddevice's: its Linux wheel does not bundle
      # PortAudio, and without it `import sounddevice` raises (M2 phase 7).
      - name: Install Qt and audio runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libportaudio2

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      # In parallel: work-stealing measured fastest here. A runner's core count
      # decides how many workers `auto` starts (docs/user-issues/tests-speeds.md).
      - name: Test
        run: pytest -n auto --dist worksteal

  # D-27's whole rationale is that packaging mistakes surface now rather than
  # at release. `pip install -e .` does not exercise the wheel, so on its own
  # it cannot deliver that: a missing __init__.py, undeclared package data or
  # a module left out of the build all stay invisible. This job installs the
  # built artifact into a clean environment instead.
  package:
    name: wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/python -m pip install --upgrade pip
          /tmp/wheeltest/bin/python -m pip install dist/*.whl

      # The things a wheel silently loses. Package data is the one 02 calls
      # out by name: the icons are declared, the SOFA sets need the explicit
      # `artifacts` override, and neither is verified by importing from source.
      - name: Verify the installed distribution
        run: |
          /tmp/wheeltest/bin/python - <<'PY'
          from importlib.metadata import version
          from importlib.resources import files

          import immersive

          assert version("immersive") == immersive.__version__

          icons = sorted(
              p.name for p in files("immersive.assets.icons").iterdir()
              if p.name.endswith(".svg")
          )
          assert icons, "no icons in the wheel: package data was not declared"
          print(len(icons), "icons:", ", ".join(icons))

          assert (files("immersive.assets.hrtf")).is_dir()
          print("ok")
          PY

      - name: Entry point runs
        run: /tmp/wheeltest/bin/python -m immersive --version
